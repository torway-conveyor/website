    <div class="lang-switch" id="langSwitch">
      <button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="ms">BM</button>
      <button data-lang="th">ไทย</button><button data-lang="id">ID</button><button data-lang="tl">FIL</button>

    <a href="index.html" class="logo"><img src="assets/img/logo-brand.png" class="logo-img" alt="TORWAY Conveyor"></a>

<section class="page-hero" style="background-image:url(img/hero-3.webp)">
  <div class="container">
    <div class="breadcrumb"><a href="index.html" data-i18n="crumb_home"></a><i>/</i><span data-i18n="crumb_contact"></span></div>
    <h1 data-i18n="contact_title"></h1>
    <p class="ph-sub" data-i18n="ph_contact_sub"></p>
  </div>
</section>
<section class="section" style="background:linear-gradient(180deg,var(--navy),#09223d 60%,#071b30)">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-cards">
        <div class="contact-card"><span>📍</span><h4 data-i18n="contact_addr"></h4><p class="cn-only" data-i18n="contact_addr_cn"></p><p class="en-only" data-i18n="contact_addr_en"></p></div>
        <div class="contact-card"><span>📞</span><h4 data-i18n="contact_phone"></h4><p><a href="tel:+8618520691831">+86 185 2069 1831</a><br><small>Phone / WeChat / WhatsApp</small></p></div>
        <div class="contact-card"><span>✉️</span><h4 data-i18n="contact_email"></h4><p><a href="mailto:cyfeng15@163.com">cyfeng15@163.com</a></p></div>
        <div class="contact-card"><span>🛒</span><h4 data-i18n="contact_hours"></h4><p data-i18n="contact_hours_v"></p></div>
      </div>
      <form class="contact-form" id="contactForm">
        <h3 data-i18n="form_title"></h3>
        <input required name="name" data-i18n-ph="form_name">
        <input required name="contact" data-i18n-ph="form_contact">
        <select required name="type" id="formType"><option value="" data-i18n="form_type_def"></option></select>
        <textarea required name="msg" rows="4" data-i18n-ph="form_msg"></textarea>
        <button class="btn btn-primary" type="submit" data-i18n="form_send"></button>
        <p class="form-note" data-i18n="form_note"></p>
      </form>
    </div>
    <div class="visit-card">
      <div class="vc-ico">🏭</div>
      <h3 data-i18n="about_tag"></h3>
      <p data-i18n="contact_addr_en"></p>
      <a href="https://maps.google.com/?q=No.365+Shachang+1st+Road+Dalang+Dongguan" target="_blank" rel="noopener" class="btn btn-dark" data-i18n="inq_btn"></a>
    </div>
  </div>
</section>
<footer class="footer">
  <div class="container footer-grid">
    <div class="footer-col">
      <a href="index.html" class="logo"><img src="assets/img/logo-white.png" class="logo-img" alt="TORWAY Conveyor"></a>

      <a href="products/detail.html?m=inclined" data-i18n="footer_p3"></a><a href="products/detail.html?m=curve" data-i18n="footer_p4"></a>
      <a href="products/detail.html?m=roller" data-i18n="footer_p5"></a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_contact"></h4>
      <p>📍 <span data-i18n="contact_addr_short"></span></p>
      <p>📞 <a href="tel:+8618520691831">+86 185 2069 1831</a></p>
      <p>💬 WhatsApp / WeChat: +86 185 2069 1831</p>
      <p>✉️ <a href="mailto:cyfeng15@163.com">cyfeng15@163.com</a></p>
    </div>
  </div>
  <div class="footer-bottom"><div class="container"><span data-i18n="footer_copy"></span><span>Dongguan TORWAY Conveyor Equipment</span></div></div>

<div class="float-contact">
  <a href="https://wa.me/8618520691831" target="_blank" rel="noopener" class="float-wa">🟢</a>
  <a href="mailto:cyfeng15@163.com" class="float-mail">✉️</a>
</div>
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button><button class="lb-prev" id="lbPrev">‹</button><button class="lb-next" id="lbNext">›</button>
  <div class="lb-stage"><img id="lbImg" alt=""></div><div class="lb-caption" id="lbCaption"></div>
</div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/products-def.js"></script>
<script src="assets/js/page.js"></script>
<script>
initChrome();
window.PAGE_PRODUCTS.forEach(p=>{const o=document.createElement("option");o.value=p.key;o.textContent=t(p.dataKey);document.getElementById("formType").appendChild(o);});
applyPageI18n();
document.getElementById("contactForm").addEventListener("submit",e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button");
  btn.textContent=t("form_ok");
  setTimeout(()=>{e.target.reset();btn.textContent=t("form_send");},3500);
});
</script>
</body>
</html>
